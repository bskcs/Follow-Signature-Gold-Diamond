<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Style Buttons Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Light Magenta Gradient Background */
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(136, 14, 79, 0.15);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    h2 {
      color: #880e4f;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .app-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      background-color: #ffffff;
      color: #222222;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      border-radius: 16px;
      border: 1px solid rgba(233, 30, 99, 0.12);
      box-shadow: 0 4px 10px rgba(136, 14, 79, 0.08);
      transition: all 0.25s ease;
    }

    .app-btn:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 18px rgba(136, 14, 79, 0.18);
      border-color: #f06292;
    }

    .icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    /* Updated Brand Backgrounds */
    .fb-bg { background: #1877F2; }
    .google-bg { background: #DB4437; }
    .wa-bg { background: #25D366; }
    .yt-bg { background: #FF0000; }
    .ig-bg { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }

    .btn-text {
      flex-grow: 1;
      text-align: left;
    }

    .arrow-icon {
      width: 14px;
      height: 14px;
      fill: #ad1457;
      opacity: 0.6;
      flex-shrink: 0;
    }
  </style>
</head>
